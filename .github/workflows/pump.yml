name: ICECAST 24/7 LISTENER BOT (950 INSTANT THAI IP PROXY FORCE)
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: INSTALL ENVIRONMENT DEPENDENCIES
        run: |
          echo "[!] UPDATING SYSTEM AND VERIFYING DEPENDENCIES..."
          sudo apt-get update && sudo apt-get install -y curl findutils coreutils parallel

      - name: RUN AUTOMATED INSTANT MASSIVE THAI TRAFFIC GENERATOR
        run: |
          # ===================================================
          # >>> CHANGE THE URL BELOW TO YOUR ICECAST STREAM URL <<<
          STREAM_URL="http://YOUR_ICECAST_SERVER_IP:PORT/stream"
          # ===================================================

          echo "[!] FETCHING HIGH-SPEED LIVE THAILAND PROXY POOL..."
          curl -s "https://proxyscrape.com" > raw_thai.txt
          
          # EXTRACT AND CLEAN PROXY FORMAT WITHOUT CRASHING THE BASH ENVIRONMENT
          grep -E '^[0-9]' raw_thai.txt > thai_proxies.txt || true
          
          # FORCE BACKEND HARDWARE INJECTION IF LIVE LIST IS EMPTY
          echo "202.28.40.4:3128" >> thai_proxies.txt
          echo "202.44.34.34:8080" >> thai_proxies.txt
          echo "110.164.13.111:8080" >> thai_proxies.txt
          
          PROXY_COUNT=$(wc -l < thai_proxies.txt)
          echo "[+] ACTIVE THAI PROXY NODES DETECTED: $PROXY_COUNT"

          echo "[!] PREPARING 950 ADVANCED ORB BOT COMMANDS REGISTERED VIA THAI ROUTING..."
          rm -f bot_commands.txt
          
          for i in {1..950}
          do
            MODULO=$((i % 5))
            if [ $MODULO -eq 0 ]; then
              UA="ORB HisBot 271 (Thailand Network Traffic Simulator V$i)"
            elif [ $MODULO -eq 1 ]; then
              UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.$i.0 Safari/537.36"
            elif [ $MODULO -eq 2 ]; then
              UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_$((i%5))_1 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/605.1"
            elif [ $MODULO -eq 3 ]; then
              UA="Mozilla/5.0 (Linux; Android 14; SM-S928B) AppleWebKit/537.36 Chrome/122.0.$i.0 Mobile Safari/537.36"
            else
              UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_2_1) Version/17.2 Safari/605.1.15"
            fi

            PROXY_LINE=$(( (i % PROXY_COUNT) + 1 ))
            CURRENT_TH_PROXY=$(sed -n "${PROXY_LINE}p" thai_proxies.txt | tr -d '\r')

            echo "curl -x 'http://$CURRENT_TH_PROXY' -L -m 9000 -s --tcp-nodelay -A '$UA' '$STREAM_URL'" >> bot_commands.txt
          done

          # ------------------ FIRST BATCH LAUNCH (FOREGROUND BLOCKING) ------------------
          echo "[!] LAUNCHING FIRST BATCH OF 950 BOTS INSTANTLY VIA THAI PROXY TUNNELS..."
          parallel -j 950 < bot_commands.txt || true
          
          # ------------------ REFRESH SESSION FOR FLAT STABILITY ------------------
          echo "[!] REFRESHING ALL CONNECTIONS INSTANTLY TO MAINTAIN CONSTANT COUNT..."
          sleep 1

          # ------------------ SECOND BATCH LAUNCH (FOREGROUND BLOCKING) ------------------
          echo "[!] RE-LAUNCHING THE NEXT BATCH OF 950 BOTS SIMULTANEOUSLY..."
          parallel -j 950 < bot_commands.txt || true

          echo "[+] MACHINE JOB FINISHED."
