name: ICECAST 24/7 LISTENER BOT (950 INSTANT REAL THAI IP BOTS)
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: RUN AUTOMATED INSTANT MASSIVE THAI PROXY LOOP
        run: |
          # ===================================================
          # >>> CHANGE THE URL BELOW TO YOUR ICECAST STREAM URL <<<
          STREAM_URL="https://eagle.streemlion.com/proxy/dvinexc2?mp=/stream"
          # ===================================================

          echo "[!] FETCHING LIVE THAILAND PUBLIC PROXY POOL..."
          
          # AUTOMATICALLY EXTRACT FRESH PUBLIC THAILAND PROXY SERVERS
          curl -s "https://proxyscrape.com" > thai_proxies.txt
          
          # FALLBACK HIGH-AVAILABILITY THAI PROXIES IF API IS BUSY
          echo "202.28.40.4:3128" >> thai_proxies.txt
          echo "202.44.34.34:8080" >> thai_proxies.txt
          echo "110.164.13.111:8080" >> thai_proxies.txt
          
          PROXY_COUNT=$(wc -l < thai_proxies.txt)
          echo "[+] FOUND $PROXY_COUNT AVAILABLE THAI PROXIES."
          
          echo "[!] FLOODING 950 BOTS SIMULTANEOUSLY USING THAI PROXIES..."

          for i in {1..950}
          do
            # RANDOMIZE AND DISTRIBUTE USER-AGENTS EVENLY
            MODULO=$((i % 4))
            if [ $MODULO -eq 0 ]; then
              UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.$i.0 Safari/537.36"
            elif [ $MODULO -eq 1 ]; then
              UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_$((i%5))_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/605.1"
            elif [ $MODULO -eq 2 ]; then
              UA="Mozilla/5.0 (Linux; Android 14; SM-S928B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.$i.0 Mobile Safari/537.36"
            else
              UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:121.0) Gecko/20100101 Firefox/121.0"
            fi

            # ROTATE THROUGH THE LIVE THAI PROXY LIST FILE
            PROXY_LINE=$(( (i % PROXY_COUNT) + 1 ))
            CURRENT_TH_PROXY=$(sed -n "${PROXY_LINE}p" thai_proxies.txt | tr -d '\r')

            # FORCE THE CONNECTION TO ROUTE THROUGH THAI IP NETWORK AND HOLD FOR 2.5 HOURS
            curl -x "http://$CURRENT_TH_PROXY" -L -m 216000 -s -A "$UA" "$STREAM_URL" > /dev/null 2>&1 &
          done

          echo "[+] ALL 950 BOTS ARE SUCCESSFULLY CONNECTED VIA THAI PROXIES! WAITING FOR THE FIRST 2.5 HOURS..."
          sleep 9000

          echo "[!] REFRESHING BOTS TO MAINTAIN FLAT STABILITY..."
          pkill -f curl
          sleep 1

          # RELAUNCH SECOND BATCH VIA THAI PROXIES FOR FLAT 950 CONSTANT COUNT
          for i in {1..950}
          do
            MODULO=$((i % 4))
            if [ $MODULO -eq 0 ]; then UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.$i.0";
            elif [ $MODULO -eq 1 ]; then UA="Mozilla/5.0 (iPhone; CPU OS 17) Safari/605.1";
            elif [ $MODULO -eq 2 ]; then UA="Mozilla/5.0 (Linux; Android 14) Chrome/122.0.$i.0";
            else UA="Mozilla/5.0 (Windows NT 10.0; rv:121.0) Gecko/20100101 Firefox/121.0"; fi
            
            PROXY_LINE=$(( (i % PROXY_COUNT) + 1 ))
            CURRENT_TH_PROXY=$(sed -n "${PROXY_LINE}p" thai_proxies.txt | tr -d '\r')
            
            curl -x "http://$CURRENT_TH_PROXY" -L -m 216000 -s -A "$UA" "$STREAM_URL" > /dev/null 2>&1 &
          done

          echo "[+] WAITING FOR THE SECOND 2.5 HOURS..."
          sleep 9000

          echo "[!] KILLING LOCAL SESSION. NEXT MACHINE WILL TAKE OVER IMMEDIATELY."
          pkill -f curl
          echo "[+] MACHINE JOB FINISHED."
