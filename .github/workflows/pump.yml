name: ICECAST 24/7 LISTENER BOT (950 INSTANT FLAT BOTS)
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: INSTALL CONCURRENT BENCHMARK TOOLS
        run: |
          echo "[!] INSTALLING APACHE BENCHMARK AND SIEGE TOOLS..."
          sudo apt-get update && sudo apt-get install -y apache2-utils siege

      - name: RUN AUTOMATED INSTANT MASSIVE LOOP FOR 950 BOTS
        run: |
          # ===================================================
          # >>> CHANGE THE URL BELOW TO YOUR ICECAST STREAM URL <<<
          STREAM_URL="https://eagle.streemlion.com/proxy/dvinexc2?mp=/stream"
          # ===================================================
          
          # FUNCTION TO SPAWN 950 BOTS INSTANTLY USING SIEGE CONCURRENCY
          SPAWN_BOTS_INSTANT() {
            echo "[!] LAUNCHING 950 BOTS SIMULTANEOUSLY IN ONE SECOND..."
            
            # SIEGE WILL FORCE 950 REAL CONCURRENT CONNECTIONS INSTANTLY AND HOLD FOR 2.5 HOURS
            # TIME FORMAT IS 2.5 HOURS = 150M (150 MINUTES)
            siege -c 950 -t 150m -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" "$STREAM_URL" > /dev/null 2>&1 &
            
            echo "[+] 950 BOTS ARE SUCCESSFULLY FLOODED AND CONNECTED."
          }

          # --- SESSION WORKFLOW ---
          # 1. LAUNCH FIRST BATCH INSTANTLY
          SPAWN_BOTS_INSTANT
          echo "[+] WAITING FOR THE FIRST 2.5 HOURS..."
          sleep 9000

          # 2. REFRESH SESSION WITHIN THE SAME MACHINE INSTANTLY
          echo "[!] REFRESHING BOTS INSTANTLY TO MAINTAIN FLAT STABILITY..."
          pkill -f siege
          sleep 1
          SPAWN_BOTS_INSTANT
          echo "[+] WAITING FOR THE SECOND 2.5 HOURS..."
          sleep 9000

          # 3. FINAL MINUTE OF THE MACHINE SESSION BEFORE NEXT MACHINE TAKES OVER
          echo "[!] KILLING LOCAL SESSION. NEXT MACHINE WILL TAKE OVER IMMEDIATELY."
          pkill -f siege
          echo "[+] MACHINE JOB FINISHED."
