name: ICECAST 24/7 LISTENER BOT (950 INSTANT REAL THAI IP BOTS POWERFUL INJECT)
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: INSTALL ENVIRONMENT DEPENDENCIES
        run: |
          echo "[!] UPDATING SYSTEM AND VERIFYING DEPENDENCIES..."
          sudo apt-get update && sudo apt-get install -y curl findutils coreutils parallel

      - name: RUN AUTOMATED INSTANT MASSIVE THAI TRAFFIC GENERATOR
        run: |
          # ===================================================
          # >>> DIRECT TARGET ICECAST STREAM COMPLIANCE SOURCE <<<
          STREAM_URL="https://eagle.streemlion.com/proxy/dvinexc2?mp=/stream"
          # ===================================================
          
          # EXTENSIVE POOL OF REAL THAILAND NETWORK CARRIERS (AIS, TRUE, 3BB, NT)
          TH_IP_PREFIXES=(
            "1.46" "1.47" "27.55" "49.228" "49.230" "58.11" "101.108" "101.109" "110.164" "115.87" "124.120" "124.121" "124.122" "134.236" "171.96" "180.180" "182.52" "184.22" "223.204" "223.205"
          )
          NUM_PREFIXES=${#TH_IP_PREFIXES[@]}

          echo "[!] PREPARING 950 RANDOMIZED PLATFORM COMMANDS IN SYSTEM BUFFER..."
          rm -f bot_commands.txt
          
          for i in {1..950}
          do
            # GENERATE TOTALLY RANDOMIZED NON-SEQUENTIAL THAI IP ADDRESS
            RAND_INDEX=$(( RANDOM % NUM_PREFIXES ))
            PREFIX=${TH_IP_PREFIXES[$RAND_INDEX]}
            OCTET3=$(( RANDOM % 254 + 1 ))
            OCTET4=$(( RANDOM % 254 + 1 ))
            FAKE_TH_IP="$PREFIX.$OCTET3.$OCTET4"

            # FULL STOCHASTIC RANDOMIZATION ACROSS DESKTOP AND MOBILE USER-AGENTS TO PREVENT CLUSTERING
            RAND_UA_CHOICE=$(( RANDOM % 8 ))
            
            if [ $RAND_UA_CHOICE -eq 0 ]; then
              UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.$i.0 Safari/537.36"
            elif [ $RAND_UA_CHOICE -eq 1 ]; then
              UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_$((RANDOM%5))_1 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/605.1"
            elif [ $RAND_UA_CHOICE -eq 2 ]; then
              UA="Mozilla/5.0 (Linux; Android 14; SM-S928B) AppleWebKit/537.36 Chrome/122.0.$i.0 Mobile Safari/537.36"
            elif [ $RAND_UA_CHOICE -eq 3 ]; then
              UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_2_1) AppleWebKit/605.1.15 Version/17.2 Safari/605.1.15"
            elif [ $RAND_UA_CHOICE -eq 4 ]; then
              UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36 Edg/120.0.$i.0"
            elif [ $RAND_UA_CHOICE -eq 5 ]; then
              UA="Mozilla/5.0 (Linux; Android 13; CPH2437) AppleWebKit/537.36 Chrome/119.0.$i.0 Mobile Safari/537.36"
            elif [ $RAND_UA_CHOICE -eq 6 ]; then
              UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7) Chrome/120.0.$i.0 Safari/537.36"
            else
              UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:121.0) Gecko/20100101 Firefox/121.0"
            fi

            # TRIPLE FORCE INJECT THAI IP PARAMETERS DIRECTLY INSIDE HIGH-SPEED NETWORKING HEADERS
            echo "curl -L -m 9000 -s --tcp-nodelay -H 'X-Forwarded-For: $FAKE_TH_IP' -H 'Client-IP: $FAKE_TH_IP' -H 'X-Real-IP: $FAKE_TH_IP' -A '$UA' '$STREAM_URL'" >> bot_commands.txt
          done

          # ------------------ FIRST BATCH LAUNCH (FOREGROUND BLOCKING) ------------------
          echo "[!] LAUNCHING FIRST BATCH OF 950 BOTS INSTANTLY VIA ULTRARAPID MULTI-THREADING..."
          parallel -j 950 < bot_commands.txt || true
          
          # ------------------ REFRESH SESSION FOR FLAT STABILITY ------------------
          echo "[!] REFRESHING ALL CONNECTIONS INSTANTLY TO MAINTAIN CONSTANT COUNT..."
          sleep 1

          # ------------------ SECOND BATCH LAUNCH (FOREGROUND BLOCKING) ------------------
          echo "[!] RE-LAUNCHING THE NEXT BATCH OF 950 BOTS SIMULTANEOUSLY..."
          parallel -j 950 < bot_commands.txt || true

          echo "[+] MACHINE JOB FINISHED."
